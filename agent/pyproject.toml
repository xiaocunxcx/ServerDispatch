[project]
name = "serverdispatch-agent"
version = "0.1.0"
description = "Ascend NPU resource platform agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
  "pytest>=7.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
