[project]
name = "serverdispatch-backend"
version = "0.1.0"
description = "Ascend NPU resource platform backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.18",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.2.0",
  "ldap3>=2.9.1",
  "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
  "pytest>=7.4.0",
  "httpx>=0.25.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
